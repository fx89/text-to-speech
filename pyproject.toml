[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dtl-text-to-speech"
version = "1.0.3"
description="PTTS wrapper script that transforms dialogues from text to speech using multiple voices and models, and stitches the generated sounds together using PyDub. Useful for making audiobooks."
readme = "README.md"
dependencies = [
    "ptts",
    "pydub>=0.25.1",
    "audioop-lts", # required for pydub
    "pyyaml>=6.0.4"
]

[project.scripts]
text-to-speech = "text_to_speech.__main__:main"